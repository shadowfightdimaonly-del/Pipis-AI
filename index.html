<!DOCTYPE html>
<html lang="ru" data-theme="mint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1312">
<title>Pipis AI</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('pipis_theme')||'mint'}catch(e){}</script>
<style>
/* ---------- Темы ---------- */
:root{
  --bg:#0b1312; --bg-rgb:11,19,18; --panel:#0f1a18;
  --rgb:16,185,129; --acc:#10b981; --acc2:#059669; --light:#6ee7b7;
  --ink:#e6f7f1; --mute:#7fa89a; --glow:.14;
  --line:rgba(var(--rgb),.2); --card:rgba(var(--rgb),.06);
  --vh:100dvh; color-scheme:dark;
}
:root[data-theme="oled"]{
  --bg:#000000; --bg-rgb:0,0,0; --panel:#0a0a0a;
  --rgb:14,165,233; --acc:#0ea5e9; --acc2:#0369a1; --light:#7dd3fc;
  --ink:#f2f2f2; --mute:#8a8f98; --glow:.06;
}
:root[data-theme="purple"]{
  --bg:#0e0a1a; --bg-rgb:14,10,26; --panel:#150f26;
  --rgb:168,85,247; --acc:#a855f7; --acc2:#7c3aed; --light:#d8b4fe;
  --ink:#f1e8ff; --mute:#a597c4; --glow:.16;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:var(--vh);display:flex;flex-direction:column;
  background:radial-gradient(120% 55% at 50% -12%,rgba(var(--rgb),var(--glow)),transparent 60%),var(--bg)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
textarea:focus,textarea:focus-visible{outline:none}

/* ---------- Шапка ---------- */
header{flex:none;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 12px;
  border-bottom:1px solid var(--line);background:rgba(var(--bg-rgb),.82);backdrop-filter:blur(10px)}
.brand{white-space:nowrap;font-size:20px;font-weight:700;letter-spacing:.3px;flex:1;margin:0;
  background:linear-gradient(90deg,var(--light),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:transparent;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px;cursor:pointer;min-height:40px;white-space:nowrap}
.btn:active,.hicon:active{background:rgba(var(--rgb),.14)}
.hicon{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:transparent;
  display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.hicon svg{width:20px;height:20px}

/* ---------- Чат ---------- */
#chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.msg{animation:in .28s ease-out}
.msg.still{animation:none}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;max-width:85%;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;
  padding:10px 14px;border-radius:20px 20px 6px 20px;white-space:pre-wrap;overflow-wrap:anywhere;
  box-shadow:0 6px 20px rgba(var(--rgb),.22)}
.msg.user .chips{margin-bottom:6px}
.msg.user .chip{background:rgba(0,0,0,.18);border-color:rgba(255,255,255,.25);color:#fff}
.msg.bot{align-self:stretch;max-width:94%;background:var(--card);border:1px solid var(--line);
  border-radius:20px 20px 20px 6px;padding:12px 14px;backdrop-filter:blur(8px);overflow-wrap:anywhere;min-width:0}
.msg.bot p{margin:.45em 0}
.msg.bot p:first-child{margin-top:0}.msg.bot p:last-child{margin-bottom:0}
.msg.bot h3{font-size:17px;margin:.7em 0 .3em}
.msg.bot ul,.msg.bot ol{padding-left:1.3em;margin:.4em 0}
.msg.bot li{margin:.2em 0}
.msg.bot blockquote{margin:.5em 0;padding:.2em .8em;border-left:3px solid var(--acc);color:var(--mute)}
.msg.bot a{color:var(--light)}
.msg.bot code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:rgba(var(--rgb),.14);padding:1px 6px;border-radius:6px}
.code{margin:10px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:rgba(0,0,0,.45)}
.code-head{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 6px 12px;font-size:12px;color:var(--mute);background:rgba(var(--rgb),.08)}
.copy{background:none;border:1px solid var(--line);color:var(--mute);border-radius:8px;padding:2px 9px;font-size:12px;cursor:pointer}
.code pre{margin:0;padding:12px;overflow-x:auto;font-size:13.5px;line-height:1.5}
.code pre code{background:none;padding:0;font-family:ui-monospace,Menlo,Consolas,monospace}
.meta{font-size:12px;color:var(--mute);margin-top:8px}
.msg.err{border-color:#f87171}
.msg.err .content{color:#fca5a5}
.typing{display:flex;gap:6px;padding:8px 2px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:pulse 1.2s infinite ease-in-out}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.75)}40%{opacity:1;transform:scale(1)}}

.empty{margin:auto;text-align:center;padding:24px 8px;animation:in .4s ease-out}
.empty h2{font-size:28px;margin:0 0 6px;background:linear-gradient(90deg,var(--light),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.empty p{color:var(--mute);margin:0}
.sugg{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.sugg button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:14px;cursor:pointer;text-align:left}
.sugg button:active{background:rgba(var(--rgb),.16)}

/* ---------- Ввод ---------- */
.composer{flex:none;padding:8px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(rgba(var(--bg-rgb),0),var(--bg) 30%)}
.box{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding:8px;
  background:rgba(var(--rgb),.07);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(12px);transition:border-color .2s}
.box:focus-within{border-color:rgba(var(--rgb),.55)}
.row{display:flex;align-items:flex-end;gap:4px}
.box textarea{flex:1;min-width:0;resize:none;background:transparent;border:0;color:var(--ink);font:inherit;font-size:16px;padding:9px 6px;max-height:160px}
.box textarea::placeholder{color:var(--mute)}
.icon{flex:none;width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;background:transparent;color:var(--mute)}
.icon:active{background:rgba(var(--rgb),.12)}
.icon svg{width:21px;height:21px}
#send{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 4px 14px rgba(var(--rgb),.35);transition:transform .15s,opacity .2s}
#send:active{transform:scale(.92)}
#send:disabled{opacity:.35;box-shadow:none;cursor:default;transform:none}
#pending{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 0}
#pending:empty{display:none}
.chip{font-size:13px;background:rgba(var(--rgb),.12);border:1px solid var(--line);border-radius:10px;padding:3px 4px 3px 10px;
  display:inline-flex;align-items:center;gap:4px;max-width:100%}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.thumb{position:relative;width:72px;height:72px;border-radius:14px;overflow:hidden;border:1px solid var(--line);flex:none;background:rgba(0,0,0,.3)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;
  font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.msg.user .att{display:block;width:min(220px,100%);max-height:240px;object-fit:cover;border-radius:14px;margin-bottom:6px}
.chip button{background:none;border:0;color:var(--acc);font-size:17px;cursor:pointer;padding:0 6px;line-height:1}

/* ---------- Боковая панель ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;z-index:20}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(320px,86vw);z-index:21;display:flex;flex-direction:column;gap:10px;
  background:var(--panel);border-right:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  transform:translateX(-100%);visibility:hidden;transition:transform .28s ease,visibility .28s}
body.drawer-open #scrim{opacity:1;visibility:visible}
body.drawer-open #drawer{transform:none;visibility:visible}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.drawer-head h2{margin:0;font-size:20px}
.create{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:14px;padding:12px;font-weight:600;font-size:15px;cursor:pointer;
  box-shadow:0 4px 14px rgba(var(--rgb),.3)}
.create:active{transform:scale(.98)}
.chat-list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;margin-top:4px}
.list-empty{color:var(--mute);font-size:14px;text-align:center;margin:20px 8px}
.chat-item{display:flex;align-items:center;border-radius:12px;border:1px solid transparent}
.chat-item.active{background:rgba(var(--rgb),.12);border-color:var(--line)}
.chat-open{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);padding:11px 12px;font-size:15px;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-del{flex:none;width:40px;height:40px;background:none;border:0;color:var(--mute);display:grid;place-items:center;cursor:pointer;border-radius:10px}
.chat-del:active{background:rgba(248,113,113,.15);color:#f87171}
.chat-del svg{width:18px;height:18px}

/* ---------- Настройки ---------- */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;width:min(420px,92vw);max-height:90vh;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h3{margin:0 0 4px;font-size:20px}
dialog label{display:block;font-size:13px;color:var(--mute);margin:16px 0 6px}
dialog input,dialog textarea{width:100%;display:block;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--ink)}
dialog textarea{font-size:15px;resize:vertical;max-height:240px}
dialog input:focus,dialog textarea:focus{border-color:var(--acc);outline:none}
.hint{font-size:12px;color:var(--mute);margin:6px 2px 0}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.theme{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:14px;border:1px solid var(--line);
  background:transparent;color:var(--ink);font-size:12px;cursor:pointer}
.theme[aria-pressed="true"]{border-color:var(--acc);background:rgba(var(--rgb),.14)}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.sw-mint{background:linear-gradient(135deg,#10b981,#059669)}
.sw-oled{background:linear-gradient(135deg,#000 50%,#0ea5e9 50%)}
.sw-purple{background:linear-gradient(135deg,#a855f7,#7c3aed)}
details{margin-top:16px}
summary{cursor:pointer;color:var(--mute);font-size:14px;padding:4px 0}
dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;position:sticky;bottom:-20px;padding:12px 0 0;background:var(--panel)}
dialog .save{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer}
dialog .cancel{background:transparent;border:1px solid var(--line);border-radius:12px;padding:10px 16px;cursor:pointer}

@media (max-width:400px){
  header{gap:6px;padding-left:10px;padding-right:10px}
  .brand{font-size:18px}
  .btn{padding:8px 10px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div id="app">
  <header>
    <button id="menu" class="hicon" type="button" aria-label="Открыть список чатов">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <h1 class="brand">Pipis AI <span style="font-size:11px;opacity:.6;-webkit-text-fill-color:initial;color:#7fa89a">b3</span></h1>
    <button id="newChat" class="btn" type="button">Новый чат</button>
    <button id="settings" class="hicon" type="button" aria-label="Настройки">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main id="chat" aria-live="polite"></main>

  <footer class="composer">
    <form id="form" class="box" autocomplete="off">
      <div id="pending"></div>
      <div class="row">
        <button type="button" id="attach" class="icon" aria-label="Фото из галереи или камера">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <button type="button" id="attachDoc" class="icon" aria-label="Прикрепить документ или медиафайл">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        </button>
        <input type="file" id="fileDoc" accept="video/*,audio/*,application/pdf,.pdf,.txt,.md,.csv,.json" multiple hidden>
        <textarea id="input" rows="1" placeholder="Спроси что-нибудь…" aria-label="Сообщение"></textarea>
        <button id="send" class="icon" type="submit" aria-label="Отправить" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </form>
  </footer>
</div>

<!-- Боковая панель -->
<div id="scrim"></div>
<aside id="drawer" aria-label="Чаты" aria-hidden="true">
  <div class="drawer-head">
    <h2>Чаты</h2>
    <button id="closeMenu" class="hicon" type="button" aria-label="Закрыть меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <button id="createChat" class="create" type="button">+ Создать чат</button>
  <div id="chatList" class="chat-list"></div>
</aside>

<!-- Настройки -->
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3>Настройки</h3>

    <label for="key">Gemini API ключ</label>
    <input id="key" type="password" autocomplete="off" placeholder="AIza…">
    <p class="hint">Хранится только в этом браузере.</p>

    <label for="base">Custom API Proxy URL (опционально)</label>
    <input id="base" type="url" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://generativelanguage.googleapis.com">
    <p class="hint">Все запросы к Gemini пойдут через этот адрес. API-ключ тоже проходит через прокси, поэтому используй только свой.</p>

    <label for="about">Обо мне / Память Pipis AI</label>
    <textarea id="about" rows="4" maxlength="2000" placeholder="Например: Меня зовут Димыч, я замдиректора Pipis-AFC, люблю короткие и чёткие ответы без душноты"></textarea>
    <p class="hint">Подмешивается в каждый запрос, в любом чате.</p>

    <label>Тема оформления</label>
    <div class="themes" role="group" aria-label="Тема оформления">
      <button type="button" class="theme" data-theme="mint" aria-pressed="false"><span class="sw sw-mint"></span>Cyber Mint</button>
      <button type="button" class="theme" data-theme="oled" aria-pressed="false"><span class="sw sw-oled"></span>OLED Black</button>
      <button type="button" class="theme" data-theme="purple" aria-pressed="false"><span class="sw sw-purple"></span>Neon Purple</button>
    </div>

    <details>
      <summary>Дополнительно</summary>
      <label for="sys">Характер Pipis AI (системная инструкция)</label>
      <textarea id="sys" rows="5"></textarea>
      <label for="max">Макс. длина ответа (токены)</label>
      <input id="max" type="number" min="100" step="100" inputmode="numeric">
    </details>

    <div class="actions">
      <button class="cancel" value="cancel" formnovalidate>Отмена</button>
      <button class="save" value="ok">Сохранить</button>
    </div>
  </form>
</dialog>

<script>
(function(){
  function banner(msg){
    var d = document.getElementById('bootErr');
    if(!d){ d = document.createElement('div'); d.id = 'bootErr';
      d.style.cssText = 'position:fixed;left:12px;right:12px;top:84px;z-index:99;background:#3b0d0d;color:#fecaca;border:1px solid #f87171;border-radius:14px;padding:12px 14px;font:14px/1.4 system-ui,sans-serif;white-space:pre-wrap';
      document.body.appendChild(d); }
    d.textContent += msg + '\n';
  }
  window.addEventListener('error', function(e){
    if (e.target && e.target.tagName === 'SCRIPT') banner('Не загрузился файл ' + (e.target.getAttribute('src') || 'скрипта') + '. Он должен лежать рядом с index.html.');
    else banner('Ошибка JS: ' + e.message + (e.lineno ? ' (строка ' + e.lineno + ')' : ''));
  }, true);
  setTimeout(function(){
    if (!window.PIPIS_READY) banner('script.js не запустился. Проверь, что он есть в репозитории рядом с index.html и что сборка свежая.');
  }, 1500);
})();
</script>
<script>
'use strict';
window.PIPIS_READY = true;   // сигнал для index.html: скрипт дошёл до этой строки
const $ = id => document.getElementById(id);
const chatEl = $('chat'), input = $('input'), send = $('send');

// ---------- Конфиг ----------
const MODELS = ['gemini-3.8-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite']; // порядок перебора (fallback)
const DEFAULT_MAX = 1500;
const DEFAULT_SYS = 'Ты — Pipis AI, умный, быстрый и дерзкий ИИ-ассистент, созданный компанией Pipis-AFC. Отвечай чётко, по делу и с лёгким харизматичным юмором, без лишней «воды».';
const FREE_STYLE = 'Ты — Pipis AI. Тебе разрешено выражаться абсолютно свободно, использовать крепкие выражения, острый сленг и нецензурную лексику, если того требует контекст или просит пользователь. Будь максимально дерзким и без фильтров!';
const NO_LATEX = 'НИКОГДА не используй LaTeX и знаки доллара ($) для оформления математических формул и примеров. Пиши все примеры, цифры и действия простым понятным текстом (например: 4 + 8 * 5 = 44).';
const safetySettings = [
  { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_NONE' },
  { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_NONE' },
  { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_NONE' },
  { category: 'HARM_CATEGORY_DANGEROUS_CONTENT', threshold: 'BLOCK_NONE' }
];
const THEMES = { mint: '#0b1312', oled: '#000000', purple: '#0e0a1a' };
const CHATS_KEY = 'pipis_chats_v1';
const DEFAULT_BASE = 'https://generativelanguage.googleapis.com';

const store = {
  get: (k, d = '') => { try { return localStorage.getItem(k) ?? d } catch { return d } },
  set: (k, v) => { try { localStorage.setItem(k, v) } catch {} }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// ---------- Состояние и хранение чатов ----------
// chat = { id, title, ts, messages: [{ role:'user'|'model', text, files:[{name}], inline:[…только в памяти] }] }
let chats = [];
let activeId = null;
let pending = [];   // вложения, ожидающие отправки {name, mime, data}
let busy = false;
const active = () => chats.find(c => c.id === activeId);

function newChat(){
  const empty = chats.find(c => !c.messages.length);   // пустой чат не плодим
  if (empty) { activeId = empty.id; return empty }
  const c = { id: uid(), title: 'Новый чат', ts: Date.now(), messages: [] };
  chats.push(c); activeId = c.id; return c;
}
function save(){
  // файлы (base64) в localStorage не кладём — только текст и имена файлов
  let list = chats.filter(c => c.messages.length).map(c => ({
    id: c.id, title: c.title, ts: c.ts,
    messages: c.messages.map(m => ({ role: m.role, text: m.text, files: (m.files || []).map(f => ({ name: f.name })) }))
  }));
  const data = () => JSON.stringify({ activeId: active()?.messages.length ? activeId : null, chats: list });
  for (;;) {
    try { localStorage.setItem(CHATS_KEY, data()); return }
    catch { if (list.length <= 1) return; list.sort((a, b) => a.ts - b.ts); list.shift() }   // нет места — выкидываем самый старый
  }
}
function load(){
  try {
    const d = JSON.parse(store.get(CHATS_KEY, 'null'));
    if (d && Array.isArray(d.chats)) {
      chats = d.chats.filter(c => c && c.id && Array.isArray(c.messages));
      activeId = d.activeId;
    }
  } catch {}
  if (!active()) {
    const last = [...chats].sort((a, b) => b.ts - a.ts)[0];
    if (last) activeId = last.id; else newChat();
  }
}
// весь массив переписки с ролями user/model — именно он уходит в Gemini при каждом сообщении
function toContents(msgs){
  return msgs.map(m => {
    const parts = [];
    if (m.inline?.length) parts.push(...m.inline);
    else if (m.files?.length) parts.push({ text: '[Пользователь прикрепил файлы: ' + m.files.map(f => f.name).join(', ') + ' — содержимое недоступно]' });
    if (m.text) parts.push({ text: m.text });
    if (!parts.length) parts.push({ text: ' ' });
    return { role: m.role, parts };
  });
}

// ---------- Markdown ----------
function unlatex(s){
  const fix = t => t.replace(/\\times/g,'×').replace(/\\cdot/g,'·').replace(/\\div/g,'÷').replace(/\\pm/g,'±')
    .replace(/\\leq?/g,'≤').replace(/\\geq?/g,'≥').replace(/\\neq/g,'≠').replace(/\\approx/g,'≈')
    .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,'($1)/($2)').replace(/\\sqrt\{([^{}]*)\}/g,'√($1)')
    .replace(/\\text\{([^{}]*)\}/g,'$1').replace(/\^\{([^{}]*)\}/g,'^$1').replace(/[{}]/g,'').replace(/\\,/g,' ').trim();
  return s.replace(/\$\$([\s\S]+?)\$\$/g,(_,m)=>fix(m))
    .replace(/\\\[([\s\S]+?)\\\]/g,(_,m)=>fix(m))
    .replace(/\\\(([\s\S]+?)\\\)/g,(_,m)=>fix(m))
    .replace(/\$([^$\n]+)\$/g,(a,m)=>/[\\^_{}]/.test(m)?fix(m):a);
}
function inline(s){ // вход уже экранирован
  return s
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>');
}
function md(src){
  const blocks = [];
  let text = src.replace(/```([\w+#.-]*)\n?([\s\S]*?)```/g, (_, lang, code) => {
    blocks.push({ lang, code: code.replace(/\n$/, '') });
    return '\u0001' + (blocks.length - 1) + '\u0001';
  });
  text = esc(unlatex(text));
  let html = '', list = null;
  const close = () => { if (list) { html += '</' + list + '>'; list = null } };
  for (const raw of text.split('\n')) {
    const ln = raw.trimEnd();
    let m;
    if ((m = ln.match(/^\u0001(\d+)\u0001$/))) {
      close();
      const b = blocks[+m[1]];
      html += `<div class="code"><div class="code-head"><span>${esc(b.lang || 'code')}</span><button class="copy" type="button">Копировать</button></div><pre><code>${esc(b.code)}</code></pre></div>`;
      continue;
    }
    if (!ln.trim()) { close(); continue }
    if ((m = ln.match(/^#{1,6}\s+(.*)$/))) { close(); html += `<h3>${inline(m[1])}</h3>`; continue }
    if ((m = ln.match(/^\s*[-*]\s+(.*)$/))) { if (list !== 'ul') { close(); html += '<ul>'; list = 'ul' } html += `<li>${inline(m[1])}</li>`; continue }
    if ((m = ln.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); html += '<ol>'; list = 'ol' } html += `<li>${inline(m[1])}</li>`; continue }
    if ((m = ln.match(/^&gt;\s?(.*)$/))) { close(); html += `<blockquote>${inline(m[1])}</blockquote>`; continue }
    close();
    html += `<p>${inline(ln)}</p>`;
  }
  close();
  return html;
}

function addUser(text, files, still){

function empty(){

const openDrawer = () => { renderList(); document.body.classList.add('drawer-open'); $('drawer').setAttribute('aria-hidden', 'false') };
const closeDrawer = () => { document.body.classList.remove('drawer-open'); $('drawer').setAttribute('aria-hidden', 'true') };
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';

function renderList(){
  const list = $('chatList'); list.innerHTML = '';
  const items = chats.filter(c => c.messages.length).sort((a, b) => b.ts - a.ts);
  if (!items.length) { list.innerHTML = '<p class="list-empty">Пока пусто. Начни диалог.</p>'; return }
  for (const c of items) {
    const row = document.createElement('div'); row.className = 'chat-item' + (c.id === activeId ? ' active' : '');
    const open = document.createElement('button'); open.type = 'button'; open.className = 'chat-open'; open.textContent = c.title;

    del.onclick = e => { e.stopPropagation(); deleteChat(c.id) };
    row.append(open, del); list.append(row);

}
function switchedChat(){
  pending = []; drawPending(); input.value = ''; autoGrow(); stick = true;
  renderChat(); renderList(); save();
}
function openChat(id){ if (id !== activeId) { activeId = id; switchedChat() } closeDrawer() }
function createChat(){ newChat(); switchedChat(); closeDrawer() }
function deleteChat(id){
  const c = chats.find(x => x.id === id);
  if (!c || !confirm('Удалить чат «' + c.title + '»?')) return;
  chats = chats.filter(x => x.id !== id);
  if (id === activeId) {
    const last = [...chats].filter(x => x.messages.length).sort((a, b) => b.ts - a.ts)[0];
    if (last) activeId = last.id; else newChat();
    switchedChat();
  } else { renderList(); save() }
}

// ---------- Вложения и поле ввода ----------
function drawPending(){
  const p = $('pending'); p.innerHTML = '';
  pending.forEach((f, i) => {
    const remove = () => { pending.splice(i, 1); drawPending(); autoGrow() };
    if (!f.preview) { p.append(chipEl(f.name, remove)); return }
    const t = document.createElement('div'); t.className = 'thumb';
    const im = new Image(); im.src = f.preview; im.alt = f.name;
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '×'; b.setAttribute('aria-label', 'Убрать фото ' + f.name); b.onclick = remove;
    t.append(im, b); p.append(t);
  });
}
function readFile(f){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res({ name: f.name, mime: f.type || 'application/octet-stream', data: r.result.split(',')[1] });
    r.onerror = () => rej(new Error('Не смог прочитать ' + f.name));
    r.readAsDataURL(f);
  });
}
function autoGrow(){
  input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  send.disabled = busy || (!input.value.trim() && !pending.length);
}
// фото: уменьшаем до 1600px и жмём в JPEG — быстрее уходит и не упирается в лимит запроса
async function prepImage(f){
  if (!/^image\/(jpeg|png|webp)$/.test(f.type) || f.size < 400 * 1024) return readFile(f);
  try {
    const bmp = await createImageBitmap(f);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(bmp, 0, 0, w, h);
    bmp.close?.();
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .85));
    if (!blob) return readFile(f);
    return await readFile(new File([blob], f.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }));
  } catch { return readFile(f) }
}
async function addFiles(list){
  for (const f of list) {
    if (f.size > 15 * 1024 * 1024) { alert('Файл «' + f.name + '» больше 15 МБ'); continue }
    try {
      const it = f.type.startsWith('image/') ? await prepImage(f) : await readFile(f);
      if (it.mime.startsWith('image/')) it.preview = 'data:' + it.mime + ';base64,' + it.data;
      pending.push(it); drawPending(); autoGrow();
    } catch (err) { alert(err.message) }
  }
}

// ---------- Сеть: повторы + запасные модели ----------
function buildBody(model, thinking, c){
  const body = {
    contents: toContents(c.messages),     // вся переписка → у Pipis AI есть память диалога
    safetySettings,
    generationConfig: { maxOutputTokens: Math.max(100, parseInt(store.get('pipis_max', DEFAULT_MAX)) || DEFAULT_MAX) }
  };
  // у Gemini 3 по умолчанию «среднее» мышление, это главный тормоз — ставим low
  if (thinking && model.startsWith('gemini-3')) body.generationConfig.thinkingConfig = { thinkingLevel: 'low' };
  // «Обо мне» подмешиваем в каждый запрос, поэтому Pipis AI помнит пользователя в любом чате
  const about = store.get('pipis_about').trim();
  let sys = (store.get('pipis_sys') || DEFAULT_SYS) + '\n\n' + FREE_STYLE;
  if (about) sys += '\n\nПамять о пользователе (учитывай всегда, в любом чате, но не пересказывай без нужды):\n' + about;
  sys += '\n\n' + NO_LATEX;
  body.systemInstruction = { parts: [{ text: sys }] };
  return body;
}
// базовый адрес API: по умолчанию Google, либо свой прокси (Cloudflare Worker и т.п.)
function apiBase(){ return (store.get('pipis_base') || DEFAULT_BASE).trim().replace(/\/+$/, '') }
function proxyHint(){
  if (apiBase() === DEFAULT_BASE) return '';
  try { return ' (прокси: ' + new URL(apiBase()).host + ')' } catch { return ' (прокси: ' + apiBase() + ')' }
}
async function callWithRetry(model, body, key){
  const url = apiBase() + '/v1beta/models/' + encodeURIComponent(model) + ':streamGenerateContent?alt=sse';
  for (let i = 0; ; i++) {
    let r = null;
    try {
      r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
        body: JSON.stringify(body)
      });
    } catch { r = null }                       // нет сети
    if (r && r.ok) return r;
    const status = r ? r.status : 0;
    if ([0, 429, 500, 503, 504].includes(status) && i < 2) { await sleep(1800); continue }   // до 2 повторов
    let msg = r ? `${r.status} ${r.statusText}` : 'нет связи с сервером' + proxyHint();
    if (r) { try { msg = (await r.json()).error.message } catch {} }
    const err = new Error(msg); err.status = status; throw err;
  }
}
async function generate(key, c){
  let lastErr;
  for (const model of MODELS) {
    try {
      try { return await callWithRetry(model, buildBody(model, true, c), key) }
      catch (err) {
        // модель не приняла thinkingConfig — повторяем без него
        if (err.status === 400 && /think/i.test(err.message)) return await callWithRetry(model, buildBody(model, false, c), key);
        throw err;
      }
    } catch (err) {
      lastErr = err;
      // ключ/запрос неверны — смена модели не поможет; снятая с поддержки модель — идём к следующей
      if (![0, 404, 429, 500, 503, 504].includes(err.status) && !/no longer available|not found|deprecated/i.test(err.message)) throw err;
    }
  }
  throw lastErr;
}

// ---------- Отправка ----------
$('form').onsubmit = async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (busy || (!text && !pending.length)) return;
  const key = store.get('pipis_key');
  if (!key) { openSettings(); return }

  const c = active();
  const files = pending; pending = []; drawPending();
  input.value = ''; busy = true; autoGrow();

  const userMsg = {
    role: 'user', text,
    files: files.map(f => ({ name: f.name, mime: f.mime, preview: f.mime.startsWith('image/') ? f.preview : undefined })),
    inline: files.map(f => ({ inline_data: { mime_type: f.mime, data: f.data } }))
  };
  c.messages.push(userMsg);
  if (c.messages.length === 1) c.title = (text || files[0].name).replace(/\s+/g, ' ').slice(0, 40);
  c.ts = Date.now();
  save(); renderList();
  stick = true; addUser(text, userMsg.files);

  const bot = addBot();
  let full = '', finish = '';
  try {
    const res = await generate(key, c);
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    bot.querySelector('.content').innerHTML = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith('data:')) continue;
        try {
          const j = JSON.parse(ln.slice(5));
          const cand = j.candidates?.[0];
          for (const p of cand?.content?.parts || []) if (p.text) full += p.text;
          if (cand?.finishReason) finish = cand.finishReason;
          if (full && bot.isConnected) setText(bot, full);
        } catch {}
      }
    }
    if (!full) throw new Error('Пустой ответ (возможно, сработал фильтр безопасности).');
    if (chats.includes(c)) { c.messages.push({ role: 'model', text: full }); c.ts = Date.now(); save(); renderList() }
    if (!bot.isConnected && activeId === c.id) renderChat();   // пока шла генерация, чат переключали туда-обратно
    else if (finish === 'MAX_TOKENS' && bot.isConnected) {
      const m = document.createElement('div'); m.className = 'meta';
      m.textContent = 'Ответ обрезан лимитом длины. Напиши «продолжи» или увеличь лимит в настройках.'; bot.append(m);
    }
  } catch (err) {
    const i = c.messages.indexOf(userMsg); if (i >= 0) c.messages.splice(i, 1);   // неудавшееся сообщение из истории убираем
    save(); renderList();
    if (bot.isConnected) {
      bot.classList.add('err');
      bot.querySelector('.content').textContent = 'Ошибка: ' + err.message;
    }
    if (activeId === c.id) { input.value = text; pending = [...files, ...pending]; drawPending() }   // текст и вложения возвращаем, чтобы не перепечатывать
  } finally {
    busy = false; autoGrow(); input.focus();
  }
};

// ---------- Клавиатура на мобилках ----------
function fitViewport(){
  const raw = window.visualViewport ? visualViewport.height : innerHeight;
  // в WebView на старте высота может прийти нулевой или огромной: тогда не трогаем CSS-значение по умолчанию
  if (raw > 200 && raw < 4000) document.documentElement.style.setProperty('--vh', raw + 'px');
  scrollDown();
}
window.visualViewport?.addEventListener('resize', fitViewport);
window.visualViewport?.addEventListener('scroll', fitViewport);
window.addEventListener('resize', fitViewport);

// ---------- Старт ----------
applyTheme(store.get('pipis_theme', 'mint'));
load();
renderChat();
renderList();
fitViewport();
autoGrow();
if (!store.get('pipis_key')) setTimeout(openSettings, 300);

</script>
<script src="pipis-enhancements.js"></script>
</body>
</html>
