<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Pipis AI</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f0c1b;
      --panel-bg: #18132b;
      --bubble-user: #7c3aed;
      --bubble-ai: #241b42;
      --text-main: #f3f0ff;
      --text-muted: #a594fd;
      --accent: #9333ea;
      --border-color: #3b2d6b;
      --error-bg: #451010;
      --error-border: #7f1d1d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--panel-bg);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 1.2rem;
    }

    .brand span.v3 {
      font-size: 0.75rem;
      background: var(--accent);
      padding: 2px 6px;
      border-radius: 6px;
      color: white;
    }

    .controls {
      display: flex;
      gap: 8px;
    }

    select, button.btn {
      background: #2a214d;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    /* Chat Area */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 0.95rem;
      word-break: break-word;
      animation: fadeIn 0.2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--bubble-user);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.ai {
      align-self: flex-start;
      background-color: var(--bubble-ai);
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 4px;
    }

    .message.error {
      background-color: var(--error-bg);
      border: 1px solid var(--error-border);
      color: #fca5a5;
    }

    .message img.generated-img {
      max-width: 100%;
      border-radius: 10px;
      margin-top: 8px;
      display: block;
    }

    /* Download File Button in Chat */
    .file-download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      padding: 10px 14px;
      background: #3b2778;
      border: 1px solid #6d44e4;
      color: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .file-download-btn:active {
      background: #5031a8;
    }

    /* Code Snippet Styles */
    pre {
      background: #120e24;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      border: 1px solid var(--border-color);
    }

    code {
      font-family: monospace;
      font-size: 0.85rem;
    }

    /* Input Footer */
    footer {
      background: var(--panel-bg);
      padding: 12px 16px;
      border-top: 1px solid var(--border-color);
    }

    .input-box {
      display: flex;
      gap: 8px;
      background: #120e24;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 6px 14px;
      align-items: center;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.95rem;
      resize: none;
      max-height: 120px;
      outline: none;
      padding: 6px 0;
    }

    .send-btn {
      background: var(--bubble-user);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>Pipis AI</span>
      <span class="v3">v3</span>
    </div>
    <div class="controls">
      <select id="model-select">
        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
      </select>
      <button class="btn" onclick="clearChat()">Новый</button>
    </div>
  </header>

  <div id="chat-container"></div>

  <footer>
    <div class="input-box">
      <textarea id="user-input" rows="1" placeholder="Спроси что-нибудь или /img [запрос]..."></textarea>
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </footer>

  <script>
    const SYSTEM_INSTRUCTION = `Ты — Pipis AI, мощный и отзывчивый ИИ-помощник.
Если пользователь просит сгенерировать файл (код, текст, скрипт, данные и т.д.), ты НЕ должен отмазываться или писать, что ты текстовый демон и не умеешь отправлять файлы. 
Вместо этого ты ОБЯЗАН сгенерировать готовый файл в следующем формате:
[[PIPIS_FILE:filename.extension|mime_type]]
содержимое файла
[[/PIPIS_FILE]]

Например:
[[PIPIS_FILE:script.js|text/javascript]]
console.log("Hello World");
[[/PIPIS_FILE]]

Интерфейс автоматически превратит этот блок в кнопку скачивания файла для пользователя.`;

    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const modelSelect = document.getElementById('model-select');

    let history = [];

    // Auto resize textarea
    userInput.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function getApiKey() {
      let key = localStorage.getItem('pipis_api_key');
      if (!key) {
        key = prompt('Введите ваш Google AI Studio API Key:');
        if (key) localStorage.setItem('pipis_api_key', key.trim());
      }
      return key;
    }

    function addMessage(role, text, isError = false) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role} ${isError ? 'error' : ''}`;
      
      if (role === 'ai' && !isError) {
        msgDiv.innerHTML = parseCustomFileFormat(marked.parse(text));
      } else {
        msgDiv.textContent = text;
      }

      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }

    // Process file download blocks
    function parseCustomFileFormat(html) {
      const regex = /\[\[PIPIS_FILE:([^\Vert{}]+)\Vert{}([^\]]+)\]\]([\s\S]*?)\[\[\/PIPIS_FILE\]\]/g;
      return html.replace(regex, (match, filename, mime, content) => {
        const cleanContent = content.trim();
        const blob = new Blob([cleanContent], { type: mime || 'text/plain' });
        const url = URL.createObjectURL(blob);
        return `<br><a class="file-download-btn" href="${url}" download="${filename}">📄 Скачать ${filename}</a><br>`;
      });
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      const apiKey = getApiKey();
      if (!apiKey) return alert('API Key не установлен');

      addMessage('user', text);
      userInput.value = '';
      userInput.style.height = 'auto';

      if (text.startsWith('/img ')) {
        const promptText = text.replace('/img ', '').trim();
        await generateImage(promptText, apiKey);
        return;
      }

      history.push({ role: "user", parts: [{ text: text }] });

      const aiMsg = addMessage('ai', 'Печатает...');

      try {
        const selectedModel = modelSelect.value;
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
            contents: history
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'Ошибка API');
        }

        const replyText = data.candidates[0].content.parts[0].text;
        history.push({ role: "model", parts: [{ text: replyText }] });

        aiMsg.innerHTML = parseCustomFileFormat(marked.parse(replyText));

      } catch (err) {
        aiMsg.className = 'message ai error';
        aiMsg.textContent = `Ошибка: ${err.message}`;
      }
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function generateImage(promptText, apiKey) {
      const aiMsg = addMessage('ai', `Генерация изображения по запросу "${promptText}"...`);

      try {
        // Updated to use working Imagen 3 model
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            instances: [{ prompt: promptText }],
            parameters: { sampleCount: 1, aspectRatio: "1:1" }
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || 'Ошибка генерации картинки');
        }

        const b64Image = data.predictions[0].bytesBase64Encoded;
        aiMsg.innerHTML = `Вот твоё изображение:<br><img class="generated-img" src="data:image/jpeg;base64,${b64Image}" alt="${promptText}">`;

      } catch (err) {
        aiMsg.className = 'message ai error';
        aiMsg.textContent = `Ошибка: ${err.message}`;
      }
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function clearChat() {
      history = [];
      chatContainer.innerHTML = '';
    }
  </script>
</body>
</html>
