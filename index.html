<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipis AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f0d15; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        header { padding: 16px; background: #171422; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #282338; }
        .logo { font-size: 20px; font-weight: bold; color: #a855f7; display: flex; align-items: center; gap: 8px; }
        .badge { background: #8b5cf6; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        select { background: #231f33; color: #fff; border: 1px solid #3b3354; padding: 6px 12px; border-radius: 8px; outline: none; }
        #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 16px; word-break: break-word; line-height: 1.4; }
        .user { align-self: flex-end; background: #7c3aed; color: #fff; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: #1e1a2e; color: #e2e8f0; border-bottom-left-radius: 4px; border: 1px solid #2d2645; }
        .error { background: #451a1a; border-color: #7f1d1d; color: #fca5a5; }
        .file-btn { display: inline-flex; align-items: center; gap: 8px; background: #2e2647; color: #c084fc; border: 1px solid #581c87; padding: 10px 14px; border-radius: 10px; text-decoration: none; margin-top: 8px; font-weight: 500; }
        .img-result { max-width: 100%; border-radius: 12px; margin-top: 8px; }
        footer { padding: 12px 16px; background: #171422; border-top: 1px solid #282338; display: flex; gap: 8px; }
        input { flex: 1; background: #231f33; border: 1px solid #3b3354; color: #fff; padding: 12px 16px; border-radius: 24px; outline: none; }
        button { background: #7c3aed; color: #fff; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<header>
    <div class="logo">Pipis AI <span class="badge">v3</span></div>
    <select id="modelSelect">
        <option value="gemini-3.8-flash">gemini-3.8-flash</option>
    </select>
</header>

<div id="chat"></div>

<footer>
    <input type="text" id="userInput" placeholder="Спроси что-нибудь или /img [запрос]..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">➔</button>
</footer>

<script>
    const API_KEY = ""; // Вставь свой ключ Gemini, если требуется статично, или обработай динамически

    function addMessage(text, type) {
        const chat = document.getElementById('chat');
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${type}`;
        
        // Обработка генерации файлов [[PIPIS_FILE:filename|type]]content[[/PIPIS_FILE]]
        let processedText = text.replace(/\[\[PIPIS_FILE:(.*?)\Vert{}(.*?)\]\]([\s\S]*?)\[\[\/PIPIS_FILE\]\]/g, (match, name, mime, content) => {
            const blob = new Blob([content], { type: mime || 'text/plain' });
            const url = URL.createObjectURL(blob);
            return `<br><a class="file-btn" href="${url}" download="${name}">💾 Скачать ${name}</a>`;
        });

        msgDiv.innerHTML = processedText;
        chat.appendChild(msgDiv);
        chat.scrollTop = chat.scrollHeight;
        return msgDiv;
    }

    async function sendMsg() {
        const input = document.getElementById('userInput');
        const prompt = input.value.trim();
        if (!prompt) return;

        addMessage(prompt, 'user');
        input.value = '';

        if (prompt.startsWith('/img ')) {
            const imgPrompt = prompt.replace('/img ', '');
            const loadingMsg = addMessage('Генерирую картинку...', 'ai');
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-3.0-generate-002:predict?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instances: [{ prompt: imgPrompt }],
                        parameters: { sampleCount: 1, aspectRatio: "1:1" }
                    })
                });
                const data = await res.json();
                if (data.predictions && data.predictions[0]) {
                    const b64 = data.predictions[0].bytesBase64Encoded;
                    loadingMsg.innerHTML = `<img class="img-result" src="data:image/png;base64,${b64}">`;
                } else {
                    loadingMsg.className = 'msg ai error';
