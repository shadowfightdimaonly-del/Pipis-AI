name: Build Pipis AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore stable signing key
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Стабильный ключ подписи восстановлен"
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep SHA256 || true
          else
            echo "::warning::Секрет DEBUG_KEYSTORE_B64 не задан. APK подпишется случайным ключом, обновления поверх старой версии не встанут."
          fi

      - name: Install dependencies
        run: npm install

      - name: Prepare www (works with flat or www/ layout)
        run: |
          mkdir -p www
          for f in index.html style.css script.js pipis-enhancements.js; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          if [ -f www/index.html ] && [ -f www/pipis-enhancements.js ]; then
            python3 - <<'PY'
            from pathlib import Path
            p=Path('www/index.html')
            s=p.read_text(encoding='utf-8')
            tag='<script src="pipis-enhancements.js"></script>'
            if tag not in s:
                s=s.replace('</body>',tag+'\n</body>',1)
                p.write_text(s,encoding='utf-8')
            PY
          fi
          ls -la www

      - name: Generate Android project (once, in CI)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pipis-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
