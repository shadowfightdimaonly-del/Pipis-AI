name: Build Pipis AI APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore stable signing key
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Стабильный ключ подписи восстановлен"
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep SHA256 || true
          else
            echo "::warning::Секрет DEBUG_KEYSTORE_B64 не задан. APK подпишется случайным ключом, обновления поверх старой версии не встанут."
          fi

      - name: Install dependencies
        run: npm install

      - name: Prepare www (works with flat or www/ layout)
        run: |
          mkdir -p www
          for f in index.html style.css script.js pipis-enhancements.js; do
            if [ -f "$f" ] && [ ! -f "www/$f" ]; then cp "$f" www/; fi
          done
          ls -la www

      - name: Check JS syntax (broken index.html will not reach the APK)
        run: |
          node - <<'JS'
          const fs = require('fs'), cp = require('child_process'), os = require('os'), path = require('path');
          const file = fs.existsSync('www/index.html') ? 'www/index.html' : 'index.html';
          const html = fs.readFileSync(file, 'utf8');
          const re = /<script([^>]*)>([\s\S]*?)<\/script>/g;
          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'chk-'));
          let m, n = 0, bad = 0;
          while ((m = re.exec(html))) {
            if (/\bsrc=/.test(m[1]) || !m[2].trim()) continue;
            const f = path.join(tmp, 's' + (n++) + (/type="module"/.test(m[1]) ? '.mjs' : '.js'));
            fs.writeFileSync(f, m[2]);
            const r = cp.spawnSync(process.execPath, ['--check', f], { encoding: 'utf8' });
            if (r.status !== 0) { bad++; console.error('::error::Синтаксическая ошибка в скрипте #' + n + ' файла ' + file + '\n' + r.stderr); }
          }
          console.log('Проверено скриптов: ' + n + ' (' + file + ')');
          if (!n) { console.error('::error::В ' + file + ' не найдено ни одного скрипта'); process.exit(1); }
          if (bad) process.exit(1);
          JS

      - name: Generate Android project (once, in CI)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Allow microphone in Android manifest (voice input)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in RECORD_AUDIO MODIFY_AUDIO_SETTINGS; do
            grep -q "android.permission.$p" "$M" || sed -i "s#<application#<uses-permission android:name=\"android.permission.$p\" />\n    <application#" "$M"
          done
          grep -n "uses-permission" "$M"

      - name: Generate app icons
        run: npx -y @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Auto-increment versionCode & versionName
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          
          # Находим build.gradle внутри android/app
          gradle_path = Path('android/app/build.gradle')
          if gradle_path.exists():
              content = gradle_path.read_text(encoding='utf-8')
              
              # Ставим versionCode = номер запуска на GitHub (например, 12, 13, 14...)
              run_number = "${{ github.run_number }}"
              content = re.sub(r'versionCode\s+\d+', f'versionCode {run_number}', content)
              
              # Ставим versionName = 1.0.НОМЕР_РАНА
              content = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_number}"', content)
              
              gradle_path.write_text(content, encoding='utf-8')
              print(f"Обновили версию в Gradle! Новая версия: 1.0.{run_number} (code: {run_number})")
          PY

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pipis-ai-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
